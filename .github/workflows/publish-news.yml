name: Publish verified GTA 6 news

on:
  schedule:
    # 08:00, 14:00 and 20:00 in France during summer time (UTC schedule).
    - cron: "0 6,12,18 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Collect latest candidates
        run: node scripts/fetch-news.mjs

      - name: Build Video News feed
        run: node scripts/build-video-news.mjs

      - name: Validate candidate queue
        run: node scripts/validate-content.mjs --candidates

      - name: Publish eligible editorial batch
        run: node scripts/publish-approved-candidates.mjs --publish

      - name: Validate canonical content
        run: node scripts/validate-content.mjs

      - name: Build public news feed
        run: node scripts/build-public-feed.mjs

      - name: Validate public news feed
        run: node scripts/validate-content.mjs --public

      - name: Detect publication changes
        id: changes
        run: |
          if git diff --quiet -- data/candidates.json data/canonical-news.json data/publication-log.json data/news.json data/video-news.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit publication batch
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/candidates.json data/canonical-news.json data/publication-log.json data/news.json data/video-news.json
          git commit -m "Publish verified GTA 6 news"
          git push

      - name: Prepare public Pages artifact
        if: steps.changes.outputs.changed == 'true'
        run: |
          mkdir -p .pages-artifact
          rsync -a --delete \
            --exclude '.git' \
            --exclude '.pages-artifact' \
            --exclude 'data/candidates.json' \
            --exclude 'data/canonical-news.json' \
            --exclude 'data/publication-log.json' \
            --exclude 'data/rejected-or-held.json' \
            ./ .pages-artifact/

      - name: Configure GitHub Pages
        if: steps.changes.outputs.changed == 'true'
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        if: steps.changes.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: .pages-artifact

      - name: Deploy to GitHub Pages
        if: steps.changes.outputs.changed == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
