name: Collect GTA 6 candidates

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect-candidates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Collect candidates
        run: node scripts/fetch-news.mjs

      - name: Build Video News feed
        run: node scripts/build-video-news.mjs

      - name: Build sitemap
        run: node scripts/build-sitemap.mjs

      - name: Validate candidates
        run: node scripts/validate-content.mjs --candidates

      - name: Detect news changes
        id: changes
        run: |
          if git diff --quiet -- data/candidates.json data/video-news.json sitemap.xml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit candidate queue
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/candidates.json data/video-news.json sitemap.xml
          git commit -m "Collect GTA 6 candidates"
          git push
